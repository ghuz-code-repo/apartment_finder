services:
  # Веб-приложение Flask
  finder:
    build:
      context: ..
      dockerfile: apartment_finder/Dockerfile
    container_name: apartment-finder-app
    env_file:
      - .env
    labels:
      - "nginx.service=finder"
      - "nginx.auth=true"
    volumes:
      # Монтируем директории для хранения данных
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    restart: unless-stopped
    # --- Харднинг: захваченный контейнер не сможет поднять привилегии ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE       # запись в bind-mount директории
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - service_network
      - egress_network      # Доступ к внешним ресурсам: MySQL MacroCRM (172.16.0.199)
    # Macro API живёт на том же узле, что и MySQL-источник, но обращаемся к нему
    # по имени. Имя macrocrm.gh.uz публичное: если резолвер хоста не внутренний,
    # контейнер получает WAN-адрес, до которого из egress_network маршрута нет —
    # ровно тот connect timeout, что виден в логах flat_plan_service.
    # Пин убирает зависимость от DNS хоста.
    extra_hosts:
      - "api.macrocrm.gh.uz:${MACRO_API_HOST_IP:-172.16.0.199}"

volumes:
  mysql_data:

networks:
  service_network:
    external: true
  egress_network:
    external: true
    name: egress_network
