services:
  # Веб-приложение Flask
  finder:
    build:
      context: ..
      dockerfile: apartment_finder/Dockerfile
    container_name: apartment-finder-app
    env_file:
      - .env
    labels:
      - "nginx.service=finder"
      - "nginx.auth=true"
    volumes:
      # Монтируем директории для хранения данных
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    restart: unless-stopped
    # --- Харднинг: захваченный контейнер не сможет поднять привилегии ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE       # запись в bind-mount директории
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - service_network
      - egress_network      # Доступ к внешним ресурсам: MySQL MacroCRM (172.16.0.199)
    # Macro отвечает с одного узла 172.16.0.199 двумя именами: api.macrocrm.gh.uz
    # (сам API) и macrocrm.gh.uz (файлы планировок). Наружу у сервера маршрута
    # нет, поэтому оба имени пиним внутрь — публичные адреса тех же имён
    # недостижимы и дают connect timeout.
    # Сертификаты на узле разные: у macrocrm.gh.uz валидный (до 2026-10-27),
    # у api.macrocrm.gh.uz истёк 2025-09-25 и ждёт продления. Пока не продлили,
    # нужен MACRO_API_VERIFY_SSL=false в .env; после продления вернуть true.
    extra_hosts:
      - "api.macrocrm.gh.uz:${MACRO_API_HOST_IP:-172.16.0.199}"
      - "macrocrm.gh.uz:${MACRO_FILES_HOST_IP:-172.16.0.199}"

  # Рассылка напоминаний о дебиторке.
  # Отдельным процессом, потому что gunicorn ничего по расписанию не делает, а
  # держать таймер в веб-воркерах нельзя: их несколько, и каждый слал бы своё.
  # Образ тот же, отличается только команда.
  reminder-worker:
    build:
      context: ..
      dockerfile: apartment_finder/Dockerfile
    container_name: apartment-finder-reminders
    command: ["python", "reminder_worker.py"]
    env_file:
      - .env
    depends_on:
      - finder
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      # Наружу воркеру не нужно: письма и Telegram уходят через
      # notification-service внутри service_network. MySQL Macro живёт в
      # egress_network — оттуда берётся сама дебиторка.
      - service_network
      - egress_network
    extra_hosts:
      - "api.macrocrm.gh.uz:${MACRO_API_HOST_IP:-172.16.0.199}"
      - "macrocrm.gh.uz:${MACRO_FILES_HOST_IP:-172.16.0.199}"

volumes:
  mysql_data:

networks:
  service_network:
    external: true
  egress_network:
    external: true
    name: egress_network
