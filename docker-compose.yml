services:
  # Веб-приложение Flask
  finder:
    build:
      context: ..
      dockerfile: apartment_finder/Dockerfile
    container_name: apartment-finder-app
    env_file:
      - .env
    labels:
      - "nginx.service=finder"
      - "nginx.auth=true"
    volumes:
      # Монтируем директории для хранения данных
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    restart: unless-stopped
    # --- Харднинг: захваченный контейнер не сможет поднять привилегии ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE       # запись в bind-mount директории
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - service_network
      - egress_network      # Доступ к внешним ресурсам: MySQL MacroCRM (172.16.0.199)
    # У api.macrocrm.gh.uz два адреса с РАЗНЫМИ сертификатами: публичный
    # (валидный, продлевается) и внутренний 172.16.0.199, где nginx застрял на
    # сертификате, истёкшем 2025-09-25. Корпоративный DNS отдаёт внутренний,
    # поэтому имя пиним на публичный: трафик идёт наружу через egress_network,
    # зато TLS проверяется полноценно и отключать проверку не нужно.
    # Когда сертификат на внутреннем узле продлят — вернуть 172.16.0.199 через
    # MACRO_API_HOST_IP в .env, трафик перестанет ходить наружу.
    extra_hosts:
      - "api.macrocrm.gh.uz:${MACRO_API_HOST_IP:-194.31.111.2}"

volumes:
  mysql_data:

networks:
  service_network:
    external: true
  egress_network:
    external: true
    name: egress_network
